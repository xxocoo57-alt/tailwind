<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pinetour</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div
      class="bg-[url(/image/HeroImage.png)] bg-cover flex flex-col justify-between h-193.25 w-360"
    >
      <div class="flex justify-between items-center pt-8 px-30">
        <div>
          <img class="h-9 w-20 object-contain" src="/image/logo.png" />
        </div>
        <ul class="list-none text-amber-50 flex items-center gap-6">
          <li>Home</li>
          <li>About</li>
          <li>Contact</li>
          <li>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-user preview-icon"
            >
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </li>
        </ul>
        <div
          class="bg-amber-50 rounded-2xl h-5 w-5 flex items-center justify-center text-[8px] text-black"
        >
          EN
        </div>
      </div>

      <div
        class="flex flex-col justify-center items-center text-center text-amber-50 my-auto"
      >
        <div class="text-[40px] font-normal">PURE MAGIC</div>
        <div class="text-[125px] font-normal leading-none">AWAITS!</div>
        <div class="text-xl mt-2">2024</div>
      </div>

      <div class="pb-8"></div>
    </div>
    <div class="bg-[#D8E4E9] w-360 h-125">
      <div class="flex gap-10 justify-center items-center">
        <div
          class="bg-[url(/image/terkhiintsagaan.png)] w-[275.49px] h-92.5 rounded-[50px] shadow-[8px_8px_0px_0px_#29728b40,-8px_-8px_0px_0px_#1f72aa75]"
        ></div>
        <div
          class="bg-[url(/image/amarbayasgalant.png)] w-[275.49px] h-92.5 rounded-[50px] shadow-[8px_8px_0px_0px_#29728b40,-8px_-8px_0px_0px_#1f72aa75]"
        >
          <div
            class="text-amber-50 font-normal pt-35 text-center text-[26px] text-shadow-lg/30"
          >
            AMARBAYASGALANT MONASTERY
          </div>
        </div>
        <div
          class="bg-[url(/image/khuvsgul.png)] w-[275.49px] h-92.5 rounded-[50px] shadow-[8px_8px_0px_0px_#29728b40,-8px_-8px_0px_0px_#1f72aa75]"
        >
          <div
            class="text-amber-50 font-normal pt-35 text-center text-[26px] text-shadow-lg/30"
          >
            KHUVSGUL LAKE
          </div>
        </div>
        <div
          class="bg-[url(/image/khorgiin.png)] w-[275.49px] h-92.5 rounded-[50px] shadow-[8px_8px_0px_0px_#29728b40,-8px_-8px_0px_0px_#1f72aa75]"
        >
          <div
            class="text-amber-50 font-normal pt-35 text-center text-[26px] text-shadow-lg/30"
          >
            KHORGIIN TOGOO
          </div>
        </div>
      </div>
    </div>
    <div class="bg-[url(/image/map.png)] h-255.5 w-360"></div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
